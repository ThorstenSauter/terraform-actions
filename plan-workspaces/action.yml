name: 'Terraform plan workspaces'
description: >-
  Runs the Terraform plan command for several workspaces in one job and displays each plan as a pull request comment.
  The workspaces are initialised one after another, sharing one provider download, and planned in parallel. This
  includes the installation of the Terraform CLI.
inputs:
  workspaces:
    description: >-
      One workspace per line, as three whitespace-separated fields: the Terraform source directory, the name of its
      state file and the environment name used for its pull request comment. E.g.
      `infra/foundation production-foundation.tfstate production-foundation`.
    required: true
  github-token:
    description: 'The GitHub token used to create and update the pull request comments.'
    required: true
  resource-group:
    description: 'The name of the resource group containing the storage account for the Terraform backend configuration.'
    required: true
  storage-account:
    description: 'The name of the storage account containing the Terraform backend configuration.'
    required: true
  container:
    description: 'The name of the Blob Storage container containing the Terraform backend configuration.'
    required: true
  terraform-version:
    description: 'The version of Terraform to install. Defaults to latest.'
    required: false
    default: 'latest'
  lock-timeout:
    description: >-
      The duration Terraform will wait to acquire a state lock during an init or plan.
      The format has to follow the Terraform CLIs requirement of a number followed by a unit.
      Defaults to 10m.
    required: false
    default: '10m'

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    - name: Parse workspaces
      id: workspaces
      env:
        WORKSPACES: ${{ inputs.workspaces }}
      shell: bash
      run: |
        out_dir="$RUNNER_TEMP/terraform-plan-workspaces"
        rm -rf "$out_dir"
        mkdir -p "$out_dir"
        count=0
        while read -r directory state_file environment_name extra; do
          [ -z "$directory" ] && continue
          if [ -z "$environment_name" ] || [ -n "$extra" ]; then
            echo "::error title=Invalid input::Each 'workspaces' line needs exactly three fields (directory, state file, environment name), got: $directory $state_file $environment_name $extra"
            exit 1
          fi
          if [ ! -d "$directory" ]; then
            echo "::error title=Invalid input::Terraform source directory '$directory' does not exist."
            exit 1
          fi
          printf '%s\t%s\t%s\n' "$directory" "$state_file" "$environment_name" >> "$out_dir/workspaces.tsv"
          count=$((count + 1))
        done <<< "$WORKSPACES"
        if [ "$count" -eq 0 ]; then
          echo "::error title=Invalid input::'workspaces' lists no workspace."
          exit 1
        fi
        echo "out-dir=$out_dir" >> "$GITHUB_OUTPUT"
    # One after another: Terraform's plugin cache is not safe for concurrent writes. With the cache, each provider is
    # downloaded once for all workspaces. A cache directory the caller configured is kept.
    - name: Terraform init
      env:
        TF_IN_AUTOMATION: true
        BACKEND_RESOURCE_GROUP: ${{ inputs.resource-group }}
        BACKEND_STORAGE_ACCOUNT: ${{ inputs.storage-account }}
        BACKEND_CONTAINER: ${{ inputs.container }}
        LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
        OUT_DIR: ${{ steps.workspaces.outputs.out-dir }}
      shell: bash
      run: |
        export TF_PLUGIN_CACHE_DIR="${TF_PLUGIN_CACHE_DIR:-$RUNNER_TEMP/terraform-plugin-cache}"
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        while IFS=$'\t' read -r directory state_file environment_name; do
          echo "::group::terraform init ($environment_name, $directory)"
          terraform -chdir="$directory" init \
            -backend-config="resource_group_name=$BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$state_file" \
            -input=false \
            -lock-timeout="$LOCK_TIMEOUT"
          echo "::endgroup::"
        done < "$OUT_DIR/workspaces.tsv"
    # The plans run as background processes of this one step. Each one's output is buffered to a file and printed once
    # all of them have finished, rather than interleaved. A failed plan does not stop the others: every workspace gets
    # its comment, and the last step fails the action.
    - name: Terraform plan
      env:
        TF_IN_AUTOMATION: true
        LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
        OUT_DIR: ${{ steps.workspaces.outputs.out-dir }}
      shell: bash
      run: |
        # `shell: bash` runs with errexit, which would end a subshell at a failed plan before it records the exit code.
        set +e
        index=0
        while IFS=$'\t' read -r directory state_file environment_name; do
          (
            terraform -chdir="$directory" plan -no-color -input=false -lock-timeout="$LOCK_TIMEOUT" \
              > "$OUT_DIR/$index.txt" 2>&1
            echo $? > "$OUT_DIR/$index.rc"
          ) &
          index=$((index + 1))
        done < "$OUT_DIR/workspaces.tsv"
        wait

        index=0
        while IFS=$'\t' read -r directory state_file environment_name; do
          echo "::group::terraform plan ($environment_name, $directory): exit code $(cat "$OUT_DIR/$index.rc")"
          cat "$OUT_DIR/$index.txt"
          echo "::endgroup::"
          index=$((index + 1))
        done < "$OUT_DIR/workspaces.tsv"
    - name: Create or update PR comments
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      if: github.event_name == 'pull_request'
      env:
        OUT_DIR: ${{ steps.workspaces.outputs.out-dir }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const read = (file, fallback) => {
            try {
              return fs.readFileSync(path.join(process.env.OUT_DIR, file), 'utf8');
            } catch {
              return fallback;
            }
          };

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          })

          // GitHub rejects comment bodies longer than 65536 characters. Keep the end of the plan, which contains the
          // summary of changes.
          const maxPlanLength = 60000;

          const workspaces = read('workspaces.tsv', '').split('\n').filter(Boolean);
          for (const [index, line] of workspaces.entries()) {
            // Same heading as the plan action, so either action updates the other's comment.
            const heading = `### ${line.split('\t')[2]} environment`;
            const outcome = read(`${index}.rc`, '').trim() === '0' ? 'success' : 'failure';
            let plan = read(`${index}.txt`, '(no plan output)');
            if (plan.length > maxPlanLength) {
              plan = `... (truncated, see the workflow run log for the full plan)\n${plan.slice(-maxPlanLength)}`;
            }

            const output = `${heading}
          #### Terraform Plan 📖\`${outcome}\`

          <details><summary>Show Plan</summary>

          \`\`\`terraform
          ${plan}
          \`\`\`

          </details>`;

            // Matched on the whole first line rather than a substring, so `### staging environment` can never pick up
            // a differently named environment's comment.
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.split('\n')[0].trim() === heading
            })

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }
          }
    - name: Terraform plan status
      env:
        OUT_DIR: ${{ steps.workspaces.outputs.out-dir }}
      shell: bash
      run: |
        status=0
        index=0
        while IFS=$'\t' read -r directory state_file environment_name; do
          rc=$(cat "$OUT_DIR/$index.rc" 2>/dev/null || echo missing)
          if [ "$rc" != "0" ]; then
            echo "::error::terraform plan failed for $environment_name ($directory), exit code: $rc"
            status=1
          fi
          index=$((index + 1))
        done < "$OUT_DIR/workspaces.tsv"
        exit "$status"

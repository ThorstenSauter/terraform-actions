name: 'Terraform init'
description: >-
  Runs the Terraform init command in the given infrastructure directory. This includes the installation of the Terraform CLI.
inputs:
  resource-group:
    description: 'The name of the resource group containing the storage account for the Terraform backend configuration.'
    required: true
  storage-account:
    description: 'The name of the storage account containing the Terraform backend configuration.'
    required: true
  container:
    description: 'The name of the Blob Storage container containing the Terraform backend configuration.'
    required: true
  state-file:
    description: 'The name of the Terraform state file.'
    required: true
  infra-directory:
    description: 'The path to the Terraform source directory.'
    required: true
  terraform-version:
    description: >-
      The version of Terraform to install. Defaults to the version in a .terraform-version file at the repository
      root, or latest if there is none.
    required: false
    default: ''
  lock-timeout:
    description: >-
      The duration Terraform will wait to acquire a state lock during an init.
      The format has to follow the Terraform CLIs requirement of a number followed by a unit.
      Defaults to 10m.
    required: false
    default: '10m'

runs:
  using: 'composite'
  steps:
    - name: Resolve Terraform version
      id: terraform-version
      env:
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
      shell: bash
      run: |
        if [[ -n "$TERRAFORM_VERSION" ]]; then
          version="$TERRAFORM_VERSION"
        elif [[ -s .terraform-version ]]; then
          version="$(tr -d '[:space:]' < .terraform-version)"
        else
          version=latest
        fi
        echo "Using Terraform version $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        terraform_wrapper: false
    - name: Terraform init
      id: init
      env:
        TF_IN_AUTOMATION: true
        BACKEND_RESOURCE_GROUP: ${{ inputs.resource-group }}
        BACKEND_STORAGE_ACCOUNT: ${{ inputs.storage-account }}
        BACKEND_CONTAINER: ${{ inputs.container }}
        BACKEND_STATE_FILE: ${{ inputs.state-file }}
        LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
      shell: bash
      working-directory: ${{ inputs.infra-directory }}
      run: |
        terraform init \
        -backend-config="resource_group_name=$BACKEND_RESOURCE_GROUP" \
        -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT" \
        -backend-config="container_name=$BACKEND_CONTAINER" \
        -backend-config="key=$BACKEND_STATE_FILE" \
        -input=false \
        -lock-timeout="$LOCK_TIMEOUT"

name: 'Terraform plan'
description: >-
  Runs the Terraform plan command in the given infrastructure directory and displays the plan output as a pull request
  comment. This includes the installation of the Terraform CLI.
inputs:
  environment-name:
    description: 'The name of the environment to plan.'
    required: true
  github-token:
    description: 'The GitHub token used to create and update the pull request comment.'
    required: true
  resource-group:
    description: 'The name of the resource group containing the storage account for the Terraform backend configuration.'
    required: true
  storage-account:
    description: 'The name of the storage account containing the Terraform backend configuration.'
    required: true
  container:
    description: 'The name of the Blob Storage container containing the Terraform backend configuration.'
    required: true
  state-file:
    description: 'The name of the Terraform state file.'
    required: true
  infra-directory:
    description: 'The path to the Terraform source directory.'
    required: true
  terraform-version:
    description: 'The version of Terraform to install. Defaults to latest.'
    required: false
    default: 'latest'
  lock-timeout:
    description: >-
      The duration Terraform will wait to acquire a state lock during an init or plan.
      The format has to follow the Terraform CLIs requirement of a number followed by a unit.
      Defaults to 10m.
    required: false
    default: '10m'

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
    - name: Terraform init
      id: init
      env:
        TF_IN_AUTOMATION: true
        BACKEND_RESOURCE_GROUP: ${{ inputs.resource-group }}
        BACKEND_STORAGE_ACCOUNT: ${{ inputs.storage-account }}
        BACKEND_CONTAINER: ${{ inputs.container }}
        BACKEND_STATE_FILE: ${{ inputs.state-file }}
        LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
      shell: bash
      working-directory: ${{ inputs.infra-directory }}
      run: |
        terraform init \
        -backend-config="resource_group_name=$BACKEND_RESOURCE_GROUP" \
        -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT" \
        -backend-config="container_name=$BACKEND_CONTAINER" \
        -backend-config="key=$BACKEND_STATE_FILE" \
        -input=false \
        -lock-timeout="$LOCK_TIMEOUT"
    - name: Terraform plan
      id: plan
      env:
        TF_IN_AUTOMATION: true
        LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
      shell: bash
      working-directory: ${{ inputs.infra-directory }}
      continue-on-error: true
      run: terraform plan -no-color -input=false -lock-timeout="$LOCK_TIMEOUT"
    - name: Create or update PR comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      if: github.event_name == 'pull_request'
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        PLAN: ${{ steps.plan.outputs.stdout }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const heading = `### ${process.env.ENVIRONMENT_NAME} environment`;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          })
          const botComment = comments.find(comment => {
            return comment.user.type === 'Bot' && comment.body.includes(heading)
          })

          // GitHub rejects comment bodies longer than 65536 characters. Keep the end of the plan,
          // which contains the summary of changes.
          const maxPlanLength = 60000;
          let plan = process.env.PLAN;
          if (plan.length > maxPlanLength) {
            plan = `... (truncated, see the workflow run log for the full plan)\n${plan.slice(-maxPlanLength)}`;
          }

          const output = `${heading}
          #### Terraform Plan 📖\`${process.env.PLAN_OUTCOME}\`

          <details><summary>Show Plan</summary>

          \`\`\`terraform
          ${plan}
          \`\`\`

          </details>`;

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: output
            })
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
          }
    - name: Terraform plan status
      if: steps.plan.outcome == 'failure'
      shell: bash
      run: exit 1
